name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build
        run: dotnet build XamarinPosed/XamarinPosed.csproj -c Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OsuRelax
          path: XamarinPosed/bin/Release/*.apk
