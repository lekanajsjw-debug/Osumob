name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          cmdline-tools: '11076708'

      - name: Install Android workload
        run: |
          dotnet workload install android --ignore-failed-sources

      - name: Convert csproj to new SDK format
        run: |
          cat > XamarinPosed/XamarinPosed.csproj << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <TargetFramework>net8.0-android34</TargetFramework>
    <AssemblyName>XamarinPosed</AssemblyName>
    <RootNamespace>XamarinPosed</RootNamespace>
    <AndroidApplication>True</AndroidApplication>
    <AndroidPackageFormat>apk</AndroidPackageFormat>
  </PropertyGroup>
  <ItemGroup>
    <Reference Include="Mono.Android" />
    <Reference Include="Xamarin.Android.Support.Compat" />
    <Reference Include="Xamarin.Android.Support.Core" />
    <Reference Include="Xamarin.Android.Support.Design" />
  </ItemGroup>
  <ItemGroup>
    <ProjectReference Include="..\XPosedAPI\XPosedAPI.csproj" />
  </ItemGroup>
</Project>
EOF
          cat > XPosedAPI/XPosedAPI.csproj << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <TargetFramework>net8.0-android34</TargetFramework>
    <AssemblyName>XPosedAPI</AssemblyName>
    <RootNamespace>XPosedAPI</RootNamespace>
  </PropertyGroup>
  <ItemGroup>
    <Reference Include="Mono.Android" />
  </ItemGroup>
</Project>
EOF

      - name: Build Android APK
        run: dotnet build XamarinPosed/XamarinPosed.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OsuRelax-android
          path: XamarinPosed/bin/Release/net8.0-android/publish/*.apk