name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          cmdline-tools: '11076708'

      - name: Install Android workload
        run: |
          dotnet workload install android --ignore-failed-sources

      - name: Build Android APK
        run: |
          # Create minimal .NET Android project
          mkdir -p XamarinPosed && cd XamarinPosed
          dotnet new androidlib -n XamarinPosed --target-framework net8.0-android34 -o .
          cd ..
          cd XPosedAPI || mkdir -p XPosedAPI
          cd XPosedAPI
          dotnet new androidlib -n XPosedAPI --target-framework net8.0-android34 -o .
          cd ..
          # Build
          dotnet build XamarinPosed/XamarinPosed.csproj -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OsuRelax-android
          path: XamarinPosed/bin/Release/net8.0-android/publish/*.apk