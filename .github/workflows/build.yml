name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Install Visual Studio Build Tools
      run: |
        choco install visualstudio2022buildtools -y
        choco install visualstudio2022-workload-net-xamarin -y
        
    - name: Build XamarinPosed (ARM64)
      run: |
        msbuild XamarinPosed/XamarinPosed.csproj /p:Configuration=Release /p:AndroidABI=arm64-v8a /p:OutputPath=bin/Release/ARM64
      shell: cmd
      
    - name: Upload XamarinPosed APK
      uses: actions/upload-artifact@v4
      with:
        name: XamarinPosed-ARM64
        path: XamarinPosed/bin/Release/**/*.apk