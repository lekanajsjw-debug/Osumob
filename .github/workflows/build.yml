name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          cmdline-tools: '11076708'

      - name: Cache dotnet
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Install Android workload
        run: dotnet workload install android --ignore-failed-sources

      - name: Convert csproj to new SDK format
        run: |
          # Convert main project
          cat > XamarinPosed/XamarinPosed.csproj.new << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <TargetFramework>net8.0-android</TargetFramework>
    <AssemblyName>XamarinPosed</AssemblyName>
    <AndroidApplication>True</AndroidApplication>
    <AndroidUseLatestPlatformSdk>false</AndroidUseLatestPlatformSdk>
    <AndroidPlatform>28</AndroidPlatform>
    <SupportedAbis>armeabi-v7a;arm64-v8a;x86;x86_64</SupportedAbis>
  </PropertyGroup>
  <ItemGroup>
    <Reference Include="Mono.Android" />
  </ItemGroup>
  <ItemGroup>
    <ProjectReference Include="..\XPosedAPI\XPosedAPI.csproj" />
  </ItemGroup>
</Project>
EOF
          # Convert API project  
          cat > XPosedAPI/XPosedAPI.csproj.new << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<Project ToolsVersion="4.0" DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
  <PropertyGroup>
    <Configuration Condition=" '$(Configuration)' == '' ">Debug</Configuration>
    <Platform Condition=" '$(Platform)' == '' ">AnyCPU</Platform>
    <TargetFrameworkVersion>v9.0</TargetFrameworkVersion>
    <TargetFramework>net8.0-android</TargetFramework>
    <AssemblyName>XPosedAPI</AssemblyName>
    <AndroidUseLatestPlatformSdk>false</AndroidUseLatestPlatformSdk>
  </PropertyGroup>
  <PropertyGroup Condition=" '$(Configuration)|$(Platform)' == 'Debug|AnyCPU' ">
    <DebugSymbols>true</DebugSymbols>
    <DebugType>portable</DebugType>
    <Optimize>false</Optimize>
    <OutputPath>bin\Debug\</OutputPath>
  </PropertyGroup>
  <PropertyGroup Condition=" '$(Configuration)|$(Platform)' == 'Release|AnyCPU' ">
    <DebugType>portable</DebugType>
    <Optimize>true</Optimize>
    <OutputPath>bin\Release\</OutputPath>
  </PropertyGroup>
  <ItemGroup>
    <Reference Include="Mono.Android" />
    <Reference Include="System" />
    <Reference Include="System.Core" />
  </ItemGroup>
  <ItemGroup>
    <Compile Include="Additions\Unhook.cs" />
    <Compile Include="Properties\AssemblyInfo.cs" />
  </ItemGroup>
  <ItemGroup>
    <InputJar Include="Jars\api-82.jar" />
  </ItemGroup>
  <ItemGroup>
    <TransformFile Include="Transforms\Metadata.xml" />
    <TransformFile Include="Transforms\EnumFields.xml" />
    <TransformFile Include="Transforms\EnumMethods.xml" />
  </ItemGroup>
  <Import Project="$(MSBuildExtensionsPath)Xamarin\Android\Xamarin.Android.Bindings.targets" />
</Project>
EOF
          mv XamarinPosed/XamarinPosed.csproj.new XamarinPosed/XamarinPosed.csproj
          mv XPosedAPI/XPosedAPI.csproj.new XPosedAPI/XPosedAPI.csproj

      - name: Build Android APK
        run: |
          dotnet publish XamarinPosed/XamarinPosed.csproj \
            -c Release \
            -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OsuRelax-android
          path: XamarinPosed/bin/Release/net8.0-android/publish/*.apk