name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.android/sdk
          key: android-sdk-${{ runner.os }}-v1
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          
      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.1157926"
          
      - name: Install Android workload
        run: dotnet workload install android
        
      - name: Restore packages
        run: dotnet restore XamarinPosed/XamarinPosed.csproj
        
      - name: Build XamarinPosed
        run: dotnet build XamarinPosed/XamarinPosed.csproj -c Release --no-restore -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          
      - name: Build JavaCodePostProcessor
        run: dotnet build JavaCodePostProcessor/JavaCodePostProcessor.csproj -c Release
        
      - name: Build Native JNI (optional)
        if: false  # Disable - needs NDK setup
        run: |
          cd jni
          $ANDROID_NDK_ROOT/ndk-build || echo "NDK build skipped"
          
      - name: Find APK
        id: find_apk
        run: |
          find XamarinPosed/bin/Release -name "*.apk" -type f > apk_paths.txt
          if [ -s apk_paths.txt ]; then
            APK_PATH=$(head -1 apk_paths.txt)
            echo "Found APK: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "No APK found!"
            ls -la XamarinPosed/bin/Release/
            exit 1
          fi
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XamarinPosed-release.apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 5
