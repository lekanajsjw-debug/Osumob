name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          
    - name: Install Xamarin.Android
      run: |
        dotnet tool install --global Xamarin.Android.Sdk --version 17.4.0 || true
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet workload install android --from-rollback-file<<EOF
RollbackFile=android
EOF

    - name: Restore NuGet packages
      run: |
        dotnet restore XamarinPosed/XamarinPosed.csproj
        
    - name: Build XamarinPosed (ARM64)
      run: |
        dotnet build XamarinPosed/XamarinPosed.csproj -c Release -p:AndroidABI=arm64-v8a -p:AndroidPackageFormat=Apk
      shell: bash
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XamarinPosed-ARM64
        path: XamarinPosed/bin/Release/**/**/*.apk