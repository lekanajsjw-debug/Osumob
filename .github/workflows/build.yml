name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [android-arm64, android-arm, android-x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          cmdline-tools: 'latest'
          api-level: 34
          build-tools: '34.0.0'

      - name: Cache dotnet
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore XamarinPosed/XamarinPosed.csproj

      - name: Publish Android APK (${{ matrix.rid }})
        run: |
          dotnet publish XamarinPosed/XamarinPosed.csproj \
            -c Release \
            -f net8.0-android \
            -r ${{ matrix.rid }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseAapt2=true

      - name: Upload APK (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: OsuRelax-${{ matrix.rid }}
          path: XamarinPosed/bin/Release/net8.0-android/${{ matrix.rid }}/publish/*.apk