name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.100'

      - name: Clean NuGet caches
        run: |
          dotnet nuget locals all --clear
          dotnet cache clean --all

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          cmdline-tools: '11076708'

      - name: Install Android workload
        run: |
          dotnet workload install android --ignore-failed-sources

      - name: Build Android APK
        run: |
          # Check dotnet version
          dotnet --version
          # Show available workloads
          dotnet workload list
          # Clean only build directories
          rm -rf XPosedAPI/obj XPosedAPI/bin XamarinPosed/obj XamarinPosed/bin
          # Build
          dotnet build XamarinPosed/XamarinPosed.csproj -c Release
          # Publish
          dotnet publish XamarinPosed/XamarinPosed.csproj -c Release -o ./publish

      - name: Upload and Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.apk
          name: Release Build
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}