name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Setup NuGet
      run: |
        dotnet nuget locals all --clear
        dotnet tool install --global dotnet-nbgv || true
        
    - name: Restore dependencies
      run: |
        dotnet restore XamarinPosed/XamarinPosed.csproj
      shell: pwsh
      
    - name: Build XamarinPosed (ARM64)
      run: |
        dotnet build XamarinPosed/XamarinPosed.csproj -c Release -p:AndroidABI=arm64-v8a
      shell: pwsh
      
    - name: Build Xamarin.Posed.Demo (ARM64)
      run: |
        dotnet build Xamarin.Posed.Demo/Xamarin.Posed.Demo.csproj -c Release -p:AndroidABI=arm64-v8a
      shell: pwsh
      
    - name: Upload XamarinPosed APK
      uses: actions/upload-artifact@v4
      with:
        name: XamarinPosed-ARM64
        path: XamarinPosed/bin/Release/*/bin/**/*.apk
        
    - name: Upload Demo APK
      uses: actions/upload-artifact@v4
      with:
        name: XamarinPosedDemo-ARM64
        path: Xamarin.Posed.Demo/bin/Release/*/bin/**/*.apk