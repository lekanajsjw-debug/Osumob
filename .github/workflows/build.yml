name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: |
          dotnet workload install android
          dotnet build XamarinPosed/XamarinPosed.csproj -c Release -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: XamarinPosed/bin/Release/*.apk
