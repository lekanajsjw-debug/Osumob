name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Install Xamarin workload
      run: |
        dotnet workload install android --ignore-failed-sources
        
    - name: Build XamarinPosed (ARM64)
      run: |
        dotnet build XamarinPosed/XamarinPosed.csproj -c Release -p:AndroidABI=arm64-v8a
      shell: pwsh
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XamarinPosed-ARM64
        path: XamarinPosed/bin/Release/**/**/*.apk